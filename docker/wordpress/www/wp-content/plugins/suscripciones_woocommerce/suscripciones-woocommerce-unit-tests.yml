name: Suscripciones WooCommerce — Unit Tests

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/Unit/**"
      - "tests/bootstrap.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"

  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/Unit/**"
      - "tests/bootstrap.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"

jobs:
  unit-tests:
    name: PHPUnit Unit — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: |
          mkdir -p test-results
          ./vendor/bin/phpunit \
            --configuration phpunit.xml \
            --testsuite Unit \
            --testdox \
            --log-junit test-results/junit-php${{ matrix.php }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-unit-results-php${{ matrix.php }}
          path: test-results/junit-php${{ matrix.php }}.xml
          retention-days: 7
